# Publishes a preview of the site to GitHub Pages
# (https://charbels07.github.io/website-jessy/) on every push.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/peaceful-newton-o3rvmu]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          URL: ${{ steps.pages.outputs.base_url }}
          SITE_PREVIEW: "true"
      - name: Check approved copy
        run: node scripts/check-copy.mjs --launch
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
